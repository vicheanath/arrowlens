[package]
name = "arrowlens"
version = "0.1.0-1"
edition = "2021"

[lib]
name = "arrowlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-shell  = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
log         = "0.4"
env_logger  = "0.11"

tokio       = { version = "1", features = ["full"] }
futures     = "0.3"
async-trait = "0.1"

datafusion      = { version = "44", features = ["parquet"] }
arrow           = { version = "53", features = ["prettyprint"] }
arrow-array     = "53"
arrow-schema    = "53"
arrow-ipc       = "53"
arrow-json      = "53"
arrow-cast      = "53"

uuid      = { version = "1", features = ["v4"] }
chrono    = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres", "uuid", "chrono", "bigdecimal", "ipnetwork", "mac_address", "bit-vec"] }

# SQL Server (TDS) — sqlx dropped MSSQL in 0.7+, so SQL Server uses tiberius,
# pooled via bb8 (tiberius has no native pool). `rustls` keeps TLS consistent
# with sqlx/reqwest; `winauth` enables Windows Integrated auth (cfg-gated inside
# the crate); `compat` adapts tokio's TcpStream to tiberius's futures-io traits.
tiberius     = { version = "0.12", default-features = false, features = ["chrono", "tds73", "rustls", "winauth"] }
bb8          = "0.9"
bb8-tiberius = "0.16"
tokio-util   = { version = "0.7", features = ["compat"] }

# AI layer
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlparser  = "0.52"

# OS keychain for secret storage (DB connection strings, AI API keys).
# Target-scoped so each platform only pulls its native backend.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level    = 3
lto          = true
codegen-units = 1
panic        = "abort"
strip        = true
